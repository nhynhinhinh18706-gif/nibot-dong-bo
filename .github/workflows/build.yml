# Phát hành bản mới: đổi "version" trong package.json, commit, rồi đẩy tag cùng số, ví dụ:
#   git tag v1.2.0 && git push origin v1.2.0
# GitHub tự build .exe (Windows) + .dmg (macOS) và đăng lên Releases.
# App đã cài trên các máy sẽ tự thấy bản mới (kiểm tra lúc mở và mỗi 4 giờ).
# Chạy tay (không đăng release): tab Actions → "Build app" → Run workflow → tải ở mục Artifacts.
name: Build app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Kiểm tra tag khớp version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} khác version v$v trong package.json"; exit 1; }
      - name: Build
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: nibot-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: ignore
